name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
env:
  CARGO_TERM_COLOR: always
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo msrv --verify
        run: |
          cargo --version
          cargo install cargo-msrv --locked
          cargo msrv verify --manifest-path Cargo.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.74.1
      - name: cargo check --locked
        run: |
          cargo --version
          cargo generate-lockfile
          cargo check --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --allow-downgrade
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-features -- --deny warnings
      - name: install tarpaulin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-tarpaulin
      - name: cargo tarpaulin
        run: cargo tarpaulin --engine llvm --follow-exec --post-test-delay 10

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install Rust
        run: rustup toolchain install nightly --profile minimal
      - name: cargo bench
        run: cargo +nightly bench --all-features
